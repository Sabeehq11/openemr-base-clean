# Public deployment stack: Caddy (auto-HTTPS) -> OpenEMR -> MariaDB.
# Secrets come from deploy/.env (see .env.example). Demo data only.
services:
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [openemr]
  mysql:
    image: mariadb:11.8.8
    restart: always
    command: ['mariadbd', '--character-set-server=utf8mb4']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:?set in .env}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck.sh, --su-mysql, --connect, --innodb_initialized]
      start_period: 1m
      interval: 30s
      retries: 5
  openemr:
    image: openemr/openemr:latest
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASS}
      MYSQL_USER: openemr
      MYSQL_PASS: ${MYSQL_PASS:?set in .env}
      OE_USER: admin
      OE_PASS: ${OE_PASS:?set in .env}
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_site_addr_oath: https://${DOMAIN}
    volumes:
      - sites:/var/www/localhost/htdocs/openemr/sites
      - logs:/var/log
    depends_on:
      mysql: {condition: service_healthy}
volumes: {caddy_data: {}, db: {}, sites: {}, logs: {}}
