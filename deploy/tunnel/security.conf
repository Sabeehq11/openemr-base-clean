# Mounted into the OpenEMR container by deploy/tunnel/docker-compose.override.yml (tunnel mode only).
# Cookies set over HTTPS get the Secure flag. PHP sets cookies in the normal header table, so no "always".
# OpenEMR already sends Strict-Transport-Security itself, so it is not repeated here.
<IfModule mod_headers.c>
    Header edit Set-Cookie "^((?![^\r\n]*;\s*[Ss]ecure)[^\r\n]*)$" "$1; Secure" "expr=%{HTTPS} == 'on'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</IfModule>
